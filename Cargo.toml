[package]
name = "mbca-10x10"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A UCI engine for Grand Chess"

[[bin]]
name = "mbca-10x10"
path = "src/main.rs"

[lib]
name = "mbca_grand"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
debug-assertions = false

# Optimised builds with invariants enabled, for expensive engine verification.
[profile.checked]
inherits = "release"
lto = "thin"
panic = "unwind"
debug-assertions = true
overflow-checks = true
